name: sing-box compatibility

on:
  push:
    branches:
      - singbox-backend
    paths:
      - '.github/singbox-gust-x.ref'
      - '.github/scripts/singbox-tags.sh'
      - '.github/workflows/singbox-compat.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      singbox_version:
        description: sing-box version to test (for example v1.13.16 or latest)
        required: false
        default: latest

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [pinned, latest]
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7

      - name: Checkout gust-x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: >-
          bash .github/scripts/checkout_gust_x.sh ../gust-x
          "" "singbox-backend" branch

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve target version
        id: version
        shell: bash
        env:
          MATRIX_VERSION: ${{ matrix.version }}
          INPUT_VERSION: ${{ inputs.singbox_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${MATRIX_VERSION}" == latest && -n "${INPUT_VERSION}" ]]; then
            requested="${INPUT_VERSION}"
          else
            requested="${MATRIX_VERSION}"
          fi

          if [[ "${requested}" == pinned ]]; then
            resolved="$(cd ../gust-x && go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          else
            resolved="$(cd ../gust-x && go list -m -f '{{.Version}}' "github.com/sagernet/sing-box@${requested}")"
          fi
          echo "resolved=${resolved}" >> "${GITHUB_OUTPUT}"
          echo "Testing sing-box ${resolved}"

      - name: Select sing-box version
        if: ${{ matrix.version == 'latest' }}
        working-directory: ../gust-x
        shell: bash
        run: |
          set -euo pipefail
          go get "github.com/sagernet/sing-box@${{ steps.version.outputs.resolved }}"
          go get "github.com/sagernet/sing-box/include@${{ steps.version.outputs.resolved }}"
          go mod tidy

      - name: Compile and smoke-test backend
        shell: bash
        run: |
          set -euo pipefail
          # The Cronet runtime is a separate module compiled into the full
          # Linux feature graph. Extract it before linking the compatibility
          # binary; embedded activation policy still rejects Naive outbound.
          (cd ../gust-x && go mod download)
          tags="$(bash .github/scripts/singbox-tags.sh)"
          cronet_dir="$(cd ../gust-x && go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)"
          test -f "${cronet_dir}/libcronet.so"
          (cd ../gust-x && LD_LIBRARY_PATH="${cronet_dir}" go test -tags "${tags}" \
            -run '^(TestNativeValidationRejectsUnknownFieldWithoutLeakingSecret|TestEmptyBoxLifecycle|TestFullManifest|TestNativeProtocolTCPDataPath|TestNativeHysteria2TCPDataPath|TestNativeTUICTCPDataPath|TestNativeSSHTCPDataPath|TestNativeVLESSRealityTCPDataPath|TestNativeNaiveOutboundRejectedByPolicy)$' \
            ./backend/singbox)
          (cd ../gust-x && go test ./connector/sings ./connector/singsu ./handler/sings ./handler/singsu)
          go mod tidy
          go build -trimpath -tags "${tags}" -o "${RUNNER_TEMP}/gust-with-singbox" ./cmd/gost
          "${RUNNER_TEMP}/gust-with-singbox" -V
