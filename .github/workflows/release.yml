name: singbox-release

on:
  push:
    tags:
      - 'singbox-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Asset version for a build-only dry run
        required: false
        default: 0.0.0-dev
      gust_x_ref:
        description: Optional gust-x singbox-backend commit for a build-only dry run
        required: false
        default: ''

permissions:
  contents: write

# Sing-box releases are independent from master releases and never update the
# standard package-manager channels or the repository's latest release marker.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.5'
  SINGBOX_BRANCH: singbox-backend

jobs:
  guard:
    name: validate singbox release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the dedicated branch and tag namespace
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            if [[ "${GITHUB_REF_TYPE}" != branch || "${GITHUB_REF_NAME}" != "${SINGBOX_BRANCH}" ]]; then
              echo "manual sing-box releases must run from branch ${SINGBOX_BRANCH}" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE}" != tag || "${GITHUB_REF_NAME}" != singbox-v* ]]; then
            echo "sing-box release tags must match singbox-v*" >&2
            exit 1
          fi

          git fetch origin "+refs/heads/${SINGBOX_BRANCH}:refs/remotes/origin/${SINGBOX_BRANCH}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${SINGBOX_BRANCH}"; then
            echo "${GITHUB_SHA} is not contained in origin/${SINGBOX_BRANCH}" >&2
            exit 1
          fi

  build:
    name: build / ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout gust-x singbox source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_GUST_X_REF: ${{ inputs.gust_x_ref }}
        run: >-
          bash .github/scripts/checkout_gust_x.sh ../gust-x
          "${INPUT_GUST_X_REF}" "${GITHUB_REF_NAME}" "${GITHUB_REF_TYPE}"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and package singbox flavor
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          if [[ -z "${version}" ]]; then
            version="${GITHUB_REF_NAME#singbox-v}"
          fi
          build_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            build_tag="singbox-v${version}"
          fi

          bash .github/scripts/build_singbox_asset.sh \
            --version "${version}" \
            --tag "${build_tag}" \
            --goos "${TARGET_GOOS}" \
            --goarch "${TARGET_GOARCH}" \
            --out-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: singbox-dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 1

  release:
    name: publish singbox release
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#singbox-v}"
          if [[ -z "${version}" || "${tag}" != singbox-v* ]]; then
            echo "sing-box release tag must match singbox-v*" >&2
            exit 1
          fi

          prerelease=true
          if [[ "${tag}" =~ ^singbox-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all singbox artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: singbox-dist-*
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- ./* > checksums.txt
          )

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.meta.outputs.tag }}"
          previous="$(git tag --list 'singbox-v*' --sort=-v:refname | grep -v "^${tag}$" | head -1 || true)"
          {
            echo "## Gust embedded sing-box ${tag}"
            echo ""
            if [[ -n "${previous}" ]]; then
              git log --pretty='- %s' "${previous}..${tag}" 2>/dev/null | head -50 || true
            else
              git log --pretty='- %s' "${tag}" 2>/dev/null | head -50 || true
            fi
            echo ""
            echo "This release is built from the dedicated \`${SINGBOX_BRANCH}\` branch."
            echo "It is independent from standard \`master\` releases and does not update package-manager channels."
            echo ""
            echo "Run \`gost -singboxmanual\` for the embedded user manual."
          } > /tmp/singbox-release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ steps.meta.outputs.tag }}"
          prerelease="${{ steps.meta.outputs.prerelease }}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber

            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)"
            export tag prerelease
            python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          Path("/tmp/singbox-release-patch.json").write_text(
              json.dumps(
                  {
                      "name": os.environ["tag"],
                      "tag_name": os.environ["tag"],
                      "target_commitish": "singbox-backend",
                      "body": Path("/tmp/singbox-release-notes.md").read_text(encoding="utf-8"),
                      "prerelease": os.environ["prerelease"] == "true",
                      "make_latest": "false",
                  }
              ),
              encoding="utf-8",
          )
          PY
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --input /tmp/singbox-release-patch.json >/dev/null
          else
            create_args=(
              "${tag}"
              dist/*
              --title "${tag}"
              --notes-file /tmp/singbox-release-notes.md
              --latest=false
              --target singbox-backend
            )
            if [[ "${prerelease}" == true ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi
