name: go-ci

on:
  push:
    branches:
      - singbox-backend
    paths-ignore:
      - 'Formula/**'
      - 'bucket/**'
  pull_request:
    branches:
      - singbox-backend
  workflow_dispatch:
    inputs:
      gust_x_ref:
        description: gust-x branch to validate with this gust branch
        required: false
        default: singbox-backend
      policy_target:
        description: release branch policy to enforce for this candidate
        required: false
        type: choice
        options:
          - master
          - singbox-backend
          - qtui-route-manage
        default: singbox-backend

permissions:
  contents: read

env:
  GONOSUMDB: github.com/lovitus/sing,github.com/lovitus/sing-box,github.com/lovitus/sing-vmess

jobs:
  test:
    name: test / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, flavors, embedded]
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve gust-x ref
        id: gustx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_HEAD_REF: ${{ github.head_ref }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${PR_HEAD_REF}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_GUST_X_REF}" ]]; then
            ref="${INPUT_GUST_X_REF}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          if gh api "repos/lovitus/gust-x/git/refs/heads/${ref}" >/dev/null 2>&1; then
            echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=singbox-backend" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout gust-x
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh repo clone lovitus/gust-x ../gust-x -- --depth 1 --branch "${{ steps.gustx.outputs.ref }}"

      - name: Enforce branch policy
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.inputs.policy_target || github.base_ref || github.ref_name }}
        run: |
          policy_branch="${TARGET_BRANCH}"
          case "${policy_branch}" in
            codex/singbox-*) policy_branch=singbox-backend ;;
          esac
          bash .github/scripts/check_branch_policy.sh "${policy_branch}" ../gust-x

      - name: Validate PowerShell build script syntax
        if: ${{ matrix.suite == 'core' }}
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./build-all.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Test release helper scripts
        if: ${{ matrix.suite == 'core' }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Reject private endpoints in published documentation
        if: ${{ matrix.suite == 'core' }}
        run: >-
          python3 .github/scripts/check_doc_privacy.py
          MAINTENANCE.md RELEASE.md SINGBOX-NOTICE.md
          SINGBOX-ARCHITECTURE.md SINGBOX-INTEGRATION-FINAL-REPORT.md
          SINGBOX-VALIDATION.md
          cmd/gost/SINGBOX_MANUAL.md examples/singbox/README.md

      - name: Verify fixed-runner sing-box performance baseline
        if: ${{ matrix.suite == 'core' }}
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          baseline_ref="$(python3 -c 'import json; print(json.load(open("SINGBOX-PERFORMANCE-BASELINE.json", encoding="utf-8"))["source"]["gust_x_revision"])')"
          pinned_ref="$(tr -d '[:space:]' < .github/singbox-gust-x.ref)"
          if [[ "${baseline_ref}" != "${pinned_ref}" ]]; then
            case "${TARGET_BRANCH}" in
              codex/singbox-*)
                echo "::warning title=Performance baseline pending rebuild::fixed-runner data covers ${baseline_ref}, not fork-pin ${pinned_ref}; release remains blocked until the baseline is rebuilt"
                exit 0
                ;;
            esac
          fi
          python3 .github/scripts/check_singbox_performance.py

      - name: Download gust-x modules
        working-directory: ../gust-x
        run: go mod download

      - name: Download gust modules
        run: go mod download

      - name: Verify pinned sing-box version
        shell: bash
        run: |
          set -euo pipefail
          module_version="$(cd ../gust-x && go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          source_version="$(sed -n 's/.*PinnedVersion = "\([^"]*\)".*/\1/p' ../gust-x/backend/singbox/backend.go)"
          test -n "${source_version}"
          if [[ "${module_version}" != "${source_version}" ]]; then
            echo "sing-box version mismatch: go.mod=${module_version}, source=${source_version}" >&2
            exit 1
          fi

      - name: Verify Linux purego Naive policy rejection
        if: ${{ matrix.suite == 'flavors' }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          binary="${RUNNER_TEMP}/gust-with-singbox-purego"
          cronet_dir="$(cd ../gust-x && go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags "${tags}" -o "${binary}" ./cmd/gost

          # The embedded resource policy cannot certify the IPC/loopback bridge
          # used by the pinned native Naive client. Assert that this precise
          # configuration fails closed before Cronet starts any descendants.
          setsid env LD_LIBRARY_PATH="${cronet_dir}" \
            "${binary}" -L 'http://127.0.0.1:18993' \
            -F 'naive+singbox://user:password@127.0.0.1:443?tls.enabled=true' \
            >"${RUNNER_TEMP}/naive-smoke.log" 2>&1 &
          smoke_pid=$!
          exited=false
          status=0
          for _ in {1..40}; do
            if ! kill -0 "${smoke_pid}" 2>/dev/null; then
              if wait "${smoke_pid}"; then status=0; else status=$?; fi
              exited=true
              break
            fi
            sleep 0.25
          done
          if [[ "${exited}" != true ]]; then
            kill -KILL -- "-${smoke_pid}" 2>/dev/null || true
            wait "${smoke_pid}" 2>/dev/null || true
            cat "${RUNNER_TEMP}/naive-smoke.log" >&2
            echo "Naive runtime did not fail closed within 10 seconds" >&2
            exit 1
          fi
          kill -KILL -- "-${smoke_pid}" 2>/dev/null || true
          if [[ "${status}" -eq 0 ]] || ! grep -F \
            'naive outbound requires an IPC or loopback socket bridge in the pinned native runtime and is not supported by the embedded backend' \
            "${RUNNER_TEMP}/naive-smoke.log"; then
            cat "${RUNNER_TEMP}/naive-smoke.log" >&2
            echo "Naive runtime did not return the certified fail-closed policy error (status ${status})" >&2
            exit 1
          fi

      - name: Verify standard and singbox flavors
        if: ${{ matrix.suite == 'flavors' }}
        run: bash .github/scripts/verify_singbox_flavors.sh

      - name: Test gust-x
        if: ${{ matrix.suite == 'core' }}
        working-directory: ../gust-x
        run: >-
          timeout --signal=TERM --kill-after=30s 15m
          go test -timeout 12m
          ./...

      - name: Test gust unit packages
        if: ${{ matrix.suite == 'core' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(go list ./... | grep -v '/tests/e2e$')
          timeout --signal=TERM --kill-after=30s 15m \
            go test -timeout 12m "${packages[@]}"

      - name: Test embedded sing-box backend
        if: ${{ matrix.suite == 'embedded' }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          cronet_dir="$(cd ../gust-x && go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)"
          protocol_tests='^(TestNativeProtocolTCPDataPath|TestNativeHysteria2TCPDataPath|TestNativeTUICTCPDataPath|TestNativeSSHTCPDataPath|TestNativeVLESSRealityTCPDataPath|TestNativeNaiveOutboundRejectedByPolicy|TestEmbeddedInboundTCPProtocolMatrix|TestEmbeddedNaiveInboundUsesGOSTRouter|TestEmbeddedInboundQUICProtocolMatrix|TestEmbeddedDirectInboundUsesGOSTRouter|TestEmbeddedVLESSRealityInboundUsesGOSTRouter|TestEmbeddedShadowTLSDetourActivationUsesGOSTRouter)$'
          (cd ../gust-x && LD_LIBRARY_PATH="${cronet_dir}" go test -p 1 -race -tags "${tags}" \
            -skip "${protocol_tests}" \
            ./backend/singbox \
            ./config/cmd/singboxuri \
            ./config/cmd \
            ./chain \
            ./config/parsing/node \
            ./hop)
          # HTTP/2 and gRPC transport initialization in the pinned fork has
          # historically had upstream race-detector findings. Keep Gust
          # lifecycle and configuration integration under -race, and run the
          # selected protocol data paths normally.
          (cd ../gust-x && LD_LIBRARY_PATH="${cronet_dir}" go test -p 1 -tags "${tags}" \
            -run "${protocol_tests}" ./backend/singbox)

      - name: Validate published sing-box examples without startup
        if: ${{ matrix.suite == 'embedded' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check_singbox_examples.py
          tags="$(bash .github/scripts/singbox-tags.sh)"
          binary="${RUNNER_TEMP}/gust-with-singbox-check"
          go build -trimpath -tags "${tags}" -o "${binary}" ./cmd/gost
          bash .github/scripts/check_singbox_example_runtime.sh "${binary}"

      - name: Test privileged Linux sing-box inbounds
        if: ${{ matrix.suite == 'embedded' }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          cronet_dir="$(cd ../gust-x && go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)"
          artifact_dir="${RUNNER_TEMP}/singbox-privileged-artifact"
          mkdir -p "${artifact_dir}"
          timeout --signal=TERM --kill-after=30s 5m \
            go -C ../gust-x test -c -tags "${tags}" \
            -o "${artifact_dir}/singbox-privileged.test" ./backend/singbox
          cp "${cronet_dir}/libcronet.so" "${artifact_dir}/libcronet.so"
          container_name="gust-singbox-privileged-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Keep CAP_NET_ADMIN, root descendants, PID namespaces and mounts
          # inside Docker's lifecycle. Running these directly under sudo can
          # leave the hosted Actions runner unable to settle the job even
          # after its Complete job step has been reported successfully.
          timeout --signal=TERM --kill-after=30s 8m \
            docker run \
              --name "${container_name}" \
              --rm \
              --init \
              --privileged \
              --volume "${artifact_dir}:/artifact:ro" \
              --env LD_LIBRARY_PATH=/artifact \
              --env GUST_SINGBOX_PRIVILEGED_TESTS=1 \
              ubuntu:24.04 \
              bash -ceu '
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends iproute2 iptables util-linux
                exec /artifact/singbox-privileged.test \
                  -test.v \
                  -test.timeout=3m \
                  -test.run="^TestEmbeddedLinuxPrivilegedInboundMatrix$"
              '

  e2e:
    name: Docker E2E / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: protocol-matrix
            tests: '^(TestCoreProxyAuthenticationMatrix|TestCoreProxyProtocolMatrix|TestSOCKS5UDPAssociation|TestStreamTransportMatrix|TestUDPBackedStreamTransportMatrix)$'
          - suite: policy-routing
            tests: '^(TestAdmissionSuite|TestAuthSuite|TestBypassSuite|TestChainGroupSuite|TestFailCodesSuite|TestHostsSuite|TestIngressSuite|TestProbeSuite|TestResolverSuite|TestRoutingSuite|TestSelectorSuite)$'
          - suite: http-tls
            tests: '^(TestFileSuite|TestForwardSuite|TestHTTP2Suite|TestHTTPCacheSuite|TestHTTPSuite|TestMTLSSuite|TestPHTSuite|TestSniffingSuite|TestTLSSuite|TestUTLSSuite)$'
          - suite: dns-shadowsocks
            tests: '^(TestDNSSuite|TestShadowsocksSuite)$'
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Checkout matching gust-x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: >-
          bash .github/scripts/checkout_gust_x.sh ../gust-x
          "${INPUT_GUST_X_REF}" "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" branch

      - name: Enforce branch policy
        env:
          TARGET_BRANCH: ${{ github.event.inputs.policy_target || github.base_ref || github.ref_name }}
        run: |
          policy_branch="${TARGET_BRANCH}"
          case "${policy_branch}" in
            codex/singbox-*) policy_branch=singbox-backend ;;
          esac
          bash .github/scripts/check_branch_policy.sh "${policy_branch}" ../gust-x

      - name: Run bounded Docker E2E suite
        env:
          E2E_TESTS: ${{ matrix.tests }}
        run: >-
          timeout --signal=TERM --kill-after=30s 20m
          go test -count=1 -v -timeout 18m
          -run "${E2E_TESTS}"
          ./tests/e2e

      - name: Capture Docker state after failure
        if: ${{ failure() }}
        run: |
          docker ps -a
          docker network ls

  mihomo-uot:
    name: Mihomo UoT v2 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_VERSION: 1.26.5
      MIHOMO_VERSION: v1.19.29
      MIHOMO_ASSET: mihomo-linux-amd64-compatible-v1.19.29.gz
      MIHOMO_SHA256: 5612e698e96c8b8ad15abc4c0a4f098eba9234354b4f248cb97f2528e215b094
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Checkout matching gust-x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: >-
          bash .github/scripts/checkout_gust_x.sh ../gust-x
          "${INPUT_GUST_X_REF}" "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" branch

      - name: Build Gust
        run: go build -trimpath -o "${RUNNER_TEMP}/gust" ./cmd/gost

      - name: Download pinned Mihomo
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${MIHOMO_ASSET}"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${MIHOMO_ASSET}"
          echo "${MIHOMO_SHA256}  ${archive}" | sha256sum --check --strict
          gzip --decompress --stdout "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod 0755 "${RUNNER_TEMP}/mihomo"
          "${RUNNER_TEMP}/mihomo" -v

      - name: Verify Mihomo UoT v2 UDP and DNS data planes
        env:
          GOST_BIN: ${{ runner.temp }}/gust
          MIHOMO_BIN: ${{ runner.temp }}/mihomo
        run: go test -count=1 -v -timeout 5m ./tests/compat

  singbox-cross-build:
    name: singbox cross-build / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve and checkout gust-x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_HEAD_REF: ${{ github.head_ref }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${PR_HEAD_REF}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_GUST_X_REF}" ]]; then
            ref="${INPUT_GUST_X_REF}"
          fi
          if ! gh api "repos/lovitus/gust-x/git/refs/heads/${ref}" >/dev/null 2>&1; then
            ref=singbox-backend
          fi
          gh repo clone lovitus/gust-x ../gust-x -- --depth 1 --branch "${ref}"

      - name: Cross-build singbox flavor
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh --target "${TARGET_GOOS}" "${TARGET_GOARCH}")"
          extension=""
          if [[ "${TARGET_GOOS}" == "windows" ]]; then
            extension=.exe
          fi
          CGO_ENABLED=0 GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" \
            go build -trimpath -tags "${tags}" \
            -o "${RUNNER_TEMP}/gust-with-singbox${extension}" ./cmd/gost

  singbox-native-smoke:
    name: singbox native smoke / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Checkout matching gust-x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: >-
          bash .github/scripts/checkout_gust_x.sh ../gust-x
          "${INPUT_GUST_X_REF}" "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" branch

      - name: Build package and run native smoke
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version=0.0.0-ci
          mkdir -p dist
          bash .github/scripts/build_singbox_asset.sh \
            --version "${version}" \
            --tag v0.0.0-ci \
            --goos "${TARGET_GOOS}" \
            --goarch "${TARGET_GOARCH}" \
            --out-dir dist
          root="dist/gust-with-singbox-${TARGET_GOOS}-${TARGET_GOARCH}"
          if [[ "${TARGET_GOOS}" == windows ]]; then
            python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
              "${root}-${version}.zip" dist
          else
            tar -xzf "${root}-${version}.tar.gz" -C dist
          fi
          bash .github/scripts/smoke_singbox_asset.sh "${root}"

      - name: Upload validated asset
        uses: actions/upload-artifact@v7
        with:
          name: singbox-native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 3
