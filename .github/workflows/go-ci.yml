name: go-ci

on:
  push:
    branches:
      - singbox-backend
    paths-ignore:
      - 'Formula/**'
      - 'bucket/**'
  pull_request:
    branches:
      - singbox-backend
  workflow_dispatch:
    inputs:
      gust_x_ref:
        description: gust-x branch to validate with this gust branch
        required: false
        default: singbox-backend

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A cold pure-Go Naive build compiles the bundled Cronet surface and can
    # take more than 15 minutes on a fresh hosted runner. Keep every release
    # gate enabled and give the complete matrix enough wall-clock budget.
    timeout-minutes: 60
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve gust-x ref
        id: gustx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_HEAD_REF: ${{ github.head_ref }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${PR_HEAD_REF}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_GUST_X_REF}" ]]; then
            ref="${INPUT_GUST_X_REF}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          if gh api "repos/lovitus/gust-x/git/refs/heads/${ref}" >/dev/null 2>&1; then
            echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=singbox-backend" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout gust-x
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh repo clone lovitus/gust-x ../gust-x -- --depth 1 --branch "${{ steps.gustx.outputs.ref }}"

      - name: Enforce branch policy
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: bash .github/scripts/check_branch_policy.sh "${TARGET_BRANCH}" ../gust-x

      - name: Validate PowerShell build script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./build-all.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Test release helper scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Verify fixed-runner sing-box performance baseline
        run: python3 .github/scripts/check_singbox_performance.py

      - name: Download gust-x modules
        working-directory: ../gust-x
        run: go mod download

      - name: Download gust modules
        run: go mod download

      - name: Verify pinned sing-box version
        shell: bash
        run: |
          set -euo pipefail
          module_version="$(cd ../gust-x && go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          source_version="$(sed -n 's/.*PinnedVersion = "\([^"]*\)".*/\1/p' ../gust-x/backend/singbox/backend.go)"
          test -n "${source_version}"
          if [[ "${module_version}" != "${source_version}" ]]; then
            echo "sing-box version mismatch: go.mod=${module_version}, source=${source_version}" >&2
            exit 1
          fi

      - name: Verify Linux purego Naive runtime
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          binary="${RUNNER_TEMP}/gust-with-singbox-purego"
          cronet_dir="$(cd ../gust-x && go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags "${tags}" -o "${binary}" ./cmd/gost

          set +e
          LD_LIBRARY_PATH="${cronet_dir}" timeout --signal=TERM --kill-after=5s 2s \
            "${binary}" -L 'http://127.0.0.1:18993' \
            -F 'naive+singbox://user:password@127.0.0.1:443?tls.enabled=true' \
            >"${RUNNER_TEMP}/naive-smoke.log" 2>&1
          status=$?
          set -e
          if [[ "${status}" -ne 124 ]]; then
            cat "${RUNNER_TEMP}/naive-smoke.log" >&2
            echo "Naive runtime exited early with status ${status}" >&2
            exit 1
          fi

      - name: Test gust-x
        working-directory: ../gust-x
        run: >-
          timeout --signal=TERM --kill-after=30s 15m
          go test -timeout 12m
          ./...

      - name: Test gust unit packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(go list ./... | grep -v '/tests/e2e$')
          timeout --signal=TERM --kill-after=30s 15m \
            go test -timeout 12m "${packages[@]}"

      - name: Test embedded sing-box backend
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          cronet_dir="$(cd ../gust-x && go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)"
          protocol_tests='^(TestNativeProtocolTCPDataPath|TestNativeHysteria2TCPDataPath|TestNativeTUICTCPDataPath|TestNativeSSHTCPDataPath|TestNativeVLESSRealityTCPDataPath|TestNativeNaiveTCPDataPath|TestEmbeddedInboundTCPProtocolMatrix|TestEmbeddedNaiveInboundUsesGOSTRouter|TestEmbeddedInboundQUICProtocolMatrix|TestEmbeddedDirectInboundUsesGOSTRouter|TestEmbeddedVLESSRealityInboundUsesGOSTRouter|TestEmbeddedShadowTLSDetourActivationUsesGOSTRouter)$'
          (cd ../gust-x && LD_LIBRARY_PATH="${cronet_dir}" go test -p 1 -race -tags "${tags}" \
            -skip "${protocol_tests}" \
            ./backend/singbox \
            ./config/cmd/singboxuri \
            ./config/cmd \
            ./chain \
            ./config/parsing/node \
            ./hop)
          # HTTP/2 and gRPC transport initialization in sing-box v1.13.16 has
          # upstream race-detector findings. Keep Gust lifecycle and config
          # integration under -race, and run real protocol data paths normally.
          (cd ../gust-x && LD_LIBRARY_PATH="${cronet_dir}" go test -p 1 -tags "${tags}" \
            -run "${protocol_tests}" ./backend/singbox)

      - name: Test privileged Linux sing-box inbounds
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          cronet_dir="$(cd ../gust-x && go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)"
          test_binary="${RUNNER_TEMP}/singbox-privileged.test"
          (cd ../gust-x && go test -c -tags "${tags}" \
            -o "${test_binary}" ./backend/singbox)
          sudo env \
            LD_LIBRARY_PATH="${cronet_dir}" \
            GUST_SINGBOX_PRIVILEGED_TESTS=1 \
            "${test_binary}" \
            -test.v \
            -test.timeout=3m \
            -test.run='^TestEmbeddedLinuxPrivilegedInboundMatrix$'

      - name: Verify standard and singbox flavors
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          standard_bin="${RUNNER_TEMP}/gust-standard"
          singbox_bin="${RUNNER_TEMP}/gust-with-singbox"

          go build -trimpath -o "${standard_bin}" ./cmd/gost
          go build -trimpath -tags "${tags}" -o "${singbox_bin}" ./cmd/gost

          "${standard_bin}" -V | tee "${RUNNER_TEMP}/standard-version.txt"
          "${singbox_bin}" -V | tee "${RUNNER_TEMP}/singbox-version.txt"
          grep -F 'flavor=standard' "${RUNNER_TEMP}/standard-version.txt"
          grep -F 'flavor=singbox' "${RUNNER_TEMP}/singbox-version.txt"

          for binary in "${standard_bin}" "${singbox_bin}"; do
            "${binary}" -singboxmanual > "${RUNNER_TEMP}/singbox-manual.txt"
            grep -F '# Gust embedded sing-box manual' "${RUNNER_TEMP}/singbox-manual.txt"
            grep -F '## CLI configuration' "${RUNNER_TEMP}/singbox-manual.txt"
            grep -F '## Gust JSON configuration' "${RUNNER_TEMP}/singbox-manual.txt"
            grep -F '## Mixed CLI and JSON configuration' "${RUNNER_TEMP}/singbox-manual.txt"
          done

          if go version -m "${standard_bin}" | grep -F $'github.com/sagernet/sing-box\t'; then
            echo 'standard binary unexpectedly links sing-box' >&2
            exit 1
          fi
          go version -m "${singbox_bin}" | grep -F $'github.com/sagernet/sing-box\t'

          python3 tests/e2e/scripts/tcp_echo.py >"${RUNNER_TEMP}/echo.log" 2>&1 &
          echo_pid=$!
          (
            cd "${RUNNER_TEMP}"
            "${singbox_bin}" \
              -L 'http://127.0.0.1:18888' \
              -L 'socks5+singbox://user:password@127.0.0.1:18889' \
              -L 'http+singbox://user:password@127.0.0.1:18890' \
              -L 'singbox://?json={"type":"mixed","listen":"127.0.0.1","listen_port":18891}' \
              -F 'direct+singbox://' >"${RUNNER_TEMP}/singbox-e2e.log" 2>&1
          ) &
          gust_pid=$!
          # shellcheck disable=SC2329 # invoked by trap
          cleanup() {
            kill "${gust_pid}" "${echo_pid}" 2>/dev/null || true
            wait "${gust_pid}" "${echo_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              --proxy http://127.0.0.1:18888 http://127.0.0.1:5678 \
              | grep -Fx 'hello-gost'; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [[ "${ready}" != true ]]; then
            cat "${RUNNER_TEMP}/singbox-e2e.log" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 2 \
            --proxy 'socks5h://user:password@127.0.0.1:18889' \
            http://127.0.0.1:5678 | grep -Fx 'hello-gost'
          curl --fail --silent --show-error --max-time 2 \
            --proxy 'http://user:password@127.0.0.1:18890' \
            http://127.0.0.1:5678 | grep -Fx 'hello-gost'
          curl --fail --silent --show-error --max-time 2 \
            --proxy 'socks5h://127.0.0.1:18891' \
            http://127.0.0.1:5678 | grep -Fx 'hello-gost'

  singbox-cross-build:
    name: singbox cross-build / ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve and checkout gust-x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_HEAD_REF: ${{ github.head_ref }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${PR_HEAD_REF}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_GUST_X_REF}" ]]; then
            ref="${INPUT_GUST_X_REF}"
          fi
          if ! gh api "repos/lovitus/gust-x/git/refs/heads/${ref}" >/dev/null 2>&1; then
            ref=singbox-backend
          fi
          gh repo clone lovitus/gust-x ../gust-x -- --depth 1 --branch "${ref}"

      - name: Cross-build singbox flavor
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh --target "${TARGET_GOOS}" "${TARGET_GOARCH}")"
          extension=""
          if [[ "${TARGET_GOOS}" == "windows" ]]; then
            extension=.exe
          fi
          CGO_ENABLED=0 GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" \
            go build -trimpath -tags "${tags}" \
            -o "${RUNNER_TEMP}/gust-with-singbox${extension}" ./cmd/gost

  singbox-native-smoke:
    name: singbox native smoke / ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Checkout matching gust-x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: >-
          bash .github/scripts/checkout_gust_x.sh ../gust-x
          "${INPUT_GUST_X_REF}" "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" branch

      - name: Build package and run native smoke
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version=0.0.0-ci
          mkdir -p dist
          bash .github/scripts/build_singbox_asset.sh \
            --version "${version}" \
            --tag v0.0.0-ci \
            --goos "${TARGET_GOOS}" \
            --goarch "${TARGET_GOARCH}" \
            --out-dir dist
          root="dist/gust-with-singbox-${TARGET_GOOS}-${TARGET_GOARCH}"
          if [[ "${TARGET_GOOS}" == windows ]]; then
            python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
              "${root}-${version}.zip" dist
          else
            tar -xzf "${root}-${version}.tar.gz" -C dist
          fi
          bash .github/scripts/smoke_singbox_asset.sh "${root}"

      - name: Upload validated asset
        uses: actions/upload-artifact@v4
        with:
          name: singbox-native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 3
