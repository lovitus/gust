name: go-ci

on:
  push:
    paths-ignore:
      - 'Formula/**'
      - 'bucket/**'
  pull_request:
  workflow_dispatch:
    inputs:
      gust_x_ref:
        description: gust-x branch to validate with this gust branch
        required: false
        default: master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GO_VERSION: 1.26.3
    steps:
      - name: Checkout gust
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve gust-x ref
        id: gustx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_HEAD_REF: ${{ github.head_ref }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${PR_HEAD_REF}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_GUST_X_REF}" ]]; then
            ref="${INPUT_GUST_X_REF}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          if gh api "repos/lovitus/gust-x/git/refs/heads/${ref}" >/dev/null 2>&1; then
            echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=master" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout gust-x
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh repo clone lovitus/gust-x ../gust-x -- --depth 1 --branch "${{ steps.gustx.outputs.ref }}"

      - name: Download gust-x modules
        working-directory: ../gust-x
        run: go mod download

      - name: Test gust-x
        working-directory: ../gust-x
        # These four failures reproduce unchanged on go-gost/x master at
        # 7f72a81864c75171baa90cb114d2becae050038a with Go 1.26.3.
        run: >-
          timeout --signal=TERM --kill-after=30s 15m
          go test -timeout 12m
          -skip '^(TestInit_DefaultExchanger|TestHandleHTTP_BasicProxy|TestWrapListenerAccept)$'
          ./...

      - name: Download gust modules
        run: go mod download

      - name: Test gust unit packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(go list ./... | grep -v '/tests/e2e$')
          timeout --signal=TERM --kill-after=30s 15m \
            go test -timeout 12m "${packages[@]}"

      - name: Verify pinned sing-box version
        shell: bash
        run: |
          set -euo pipefail
          module_version="$(cd ../gust-x && go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          source_version="$(sed -n 's/.*PinnedVersion = "\([^"]*\)".*/\1/p' ../gust-x/backend/singbox/backend.go)"
          test -n "${source_version}"
          if [[ "${module_version}" != "${source_version}" ]]; then
            echo "sing-box version mismatch: go.mod=${module_version}, source=${source_version}" >&2
            exit 1
          fi

      - name: Test embedded sing-box backend
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          (cd ../gust-x && go test -tags "${tags}" ./backend/singbox)

      - name: Verify standard and singbox flavors
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash .github/scripts/singbox-tags.sh)"
          standard_bin="${RUNNER_TEMP}/gust-standard"
          singbox_bin="${RUNNER_TEMP}/gust-with-singbox"

          go build -trimpath -o "${standard_bin}" ./cmd/gost
          go build -trimpath -tags "${tags}" -o "${singbox_bin}" ./cmd/gost

          "${standard_bin}" -V | tee "${RUNNER_TEMP}/standard-version.txt"
          "${singbox_bin}" -V | tee "${RUNNER_TEMP}/singbox-version.txt"
          grep -F 'flavor=standard' "${RUNNER_TEMP}/standard-version.txt"
          grep -F 'flavor=singbox' "${RUNNER_TEMP}/singbox-version.txt"

          if go version -m "${standard_bin}" | grep -F $'github.com/sagernet/sing-box\t'; then
            echo 'standard binary unexpectedly links sing-box' >&2
            exit 1
          fi
          go version -m "${singbox_bin}" | grep -F $'github.com/sagernet/sing-box\t'

          python3 tests/e2e/scripts/tcp_echo.py >"${RUNNER_TEMP}/echo.log" 2>&1 &
          echo_pid=$!
          (
            cd "${RUNNER_TEMP}"
            "${singbox_bin}" -L 'http://127.0.0.1:18888' -F 'direct+singbox://' >"${RUNNER_TEMP}/singbox-e2e.log" 2>&1
          ) &
          gust_pid=$!
          # shellcheck disable=SC2329 # invoked by trap
          cleanup() {
            kill "${gust_pid}" "${echo_pid}" 2>/dev/null || true
            wait "${gust_pid}" "${echo_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              --proxy http://127.0.0.1:18888 http://127.0.0.1:5678 \
              | grep -Fx 'hello-gost'; then
              exit 0
            fi
            sleep 0.2
          done
          cat "${RUNNER_TEMP}/singbox-e2e.log" >&2
          exit 1
