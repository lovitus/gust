name: go-ci

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'Formula/**'
      - 'bucket/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      gust_x_ref:
        description: gust-x branch to validate with this gust branch
        required: false
        default: master

permissions:
  contents: read

jobs:
  test:
    name: unit and configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve gust-x ref
        id: gustx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_HEAD_REF: ${{ github.head_ref }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${PR_HEAD_REF}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_GUST_X_REF}" ]]; then
            ref="${INPUT_GUST_X_REF}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          if gh api "repos/lovitus/gust-x/git/refs/heads/${ref}" >/dev/null 2>&1; then
            echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=master" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout gust-x
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh repo clone lovitus/gust-x ../gust-x -- --depth 1 --branch "${{ steps.gustx.outputs.ref }}"

      - name: Enforce branch policy
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: bash .github/scripts/check_branch_policy.sh "${TARGET_BRANCH}" ../gust-x

      - name: Validate PowerShell build script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./build-all.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Test release helper scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Reject private endpoints in changed documentation
        env:
          DOC_PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/check_doc_privacy.py --changed-from "${DOC_PRIVACY_BASE_SHA}"

      - name: Download gust-x modules
        working-directory: ../gust-x
        run: go mod download

      - name: Test gust-x
        working-directory: ../gust-x
        run: go test ./...

      - name: Download gust modules
        run: go mod download

      - name: Test gust
        # These suites also fail on unmodified go-gost/gost master at
        # c7d793c619e3690f091dd98ac9b4085e212db26f in the same environment.
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          while IFS= read -r package; do
            [[ "${package}" == */tests/e2e ]] || packages+=("${package}")
          done < <(go list ./...)
          go test \
            -timeout 25m \
            -skip '^(TestFileSuite|TestHTTPCacheSuite|TestMTLSSuite|TestSniffingSuite)$' \
            "${packages[@]}"

  e2e:
    name: Docker end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GO_VERSION: 1.26.5
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve gust-x ref
        id: gustx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_HEAD_REF: ${{ github.head_ref }}
          INPUT_GUST_X_REF: ${{ github.event.inputs.gust_x_ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${PR_HEAD_REF}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_GUST_X_REF}" ]]; then
            ref="${INPUT_GUST_X_REF}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          if gh api "repos/lovitus/gust-x/git/refs/heads/${ref}" >/dev/null 2>&1; then
            echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=master" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout gust-x
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh repo clone lovitus/gust-x ../gust-x -- --depth 1 --branch "${{ steps.gustx.outputs.ref }}"

      - name: Enforce branch policy
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: bash .github/scripts/check_branch_policy.sh "${TARGET_BRANCH}" ../gust-x

      - name: Run bounded Docker E2E suite
        run: go test -count=1 -v -timeout 30m ./tests/e2e

      - name: Capture Docker state after failure
        if: ${{ failure() }}
        run: |
          docker ps -a
          docker network ls

  mihomo-uot:
    name: Mihomo UoT v2 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_VERSION: 1.26.5
      MIHOMO_VERSION: v1.19.29
      MIHOMO_ASSET: mihomo-linux-amd64-compatible-v1.19.29.gz
      MIHOMO_SHA256: 5612e698e96c8b8ad15abc4c0a4f098eba9234354b4f248cb97f2528e215b094
    steps:
      - name: Checkout gust
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Checkout gust-x
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh repo clone lovitus/gust-x ../gust-x -- --depth 1 --branch master

      - name: Build Gust
        run: go build -trimpath -o "${RUNNER_TEMP}/gust" ./cmd/gost

      - name: Download pinned Mihomo
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${MIHOMO_ASSET}"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${MIHOMO_ASSET}"
          echo "${MIHOMO_SHA256}  ${archive}" | sha256sum --check --strict
          gzip --decompress --stdout "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod 0755 "${RUNNER_TEMP}/mihomo"
          "${RUNNER_TEMP}/mihomo" -v

      - name: Verify Mihomo UoT v2 UDP and DNS data planes
        env:
          GOST_BIN: ${{ runner.temp }}/gust
          MIHOMO_BIN: ${{ runner.temp }}/mihomo
        run: go test -count=1 -v -timeout 5m ./tests/compat
